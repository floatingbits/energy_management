name: Update Demo Data

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 17 * * *'

  workflow_dispatch:

jobs:
  refresh-demo:
    environment: demo-prod
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python dependencies for local scripts
        run: pip install -r requirements.txt

      - name: Start environment
        run: docker compose -f compose.demo-export.yml up -d --build

      - name: Set up DB schema and fixtures
        run: ./dev/set_up.sh

      - name: Update data
        run: ./dev/update_forecasts.sh


      - name: Export API
        run: python dev/export_static_api.py

      - name: Build UI
        run: python dev/build_ui.py

      - name: Deploy snapshot
        run: ./dev/deploy_to_demo.sh
        env:
          DEMO_SERVER_PASSWD: ${{ env.DEMO_SERVER_PASSWD }}

      - name: Cleanup
        if: always()
        run: docker compose -f compose.demo.yml down -v